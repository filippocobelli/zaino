services:
  zaino:
    build: .
    container_name: zaino
    restart: unless-stopped
    ports:
      - "3021:3021"
    environment:
      - TZ=Europe/Rome
      # lingua di una nuova installazione (it, en…); poi si cambia dalla web app
      # - ZAINO_LANG=en
      # leggere i menù della mensa da foto e screenshot (facoltativo, vedi docs/installazione.md)
      # la chiave API si incolla in Impostazioni; in alternativa:
      # - ZAINO_AI_KEY=sk-ant-...
      # frase segreta che cifra la chiave salvata (facoltativa)
      # - ZAINO_SECRET=una-frase-lunga-a-caso
    volumes:
      - ./data:/data
    # Docker su Proxmox: se il log mostra "PermissionError ... socketpair", togli il commento:
    # security_opt:
    #   - apparmor=unconfined
